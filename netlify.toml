# Netlify hosting for the web app (demo). Netlify detects Next.js and adds its
# runtime. The app talks to the backend through its own /api proxy (see
# next.config.ts), so set BACKEND_URL in the site's environment variables to
# the backend's public address and redeploy whenever it changes.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "26"
  NEXT_TELEMETRY_DISABLED = "1"
  # TEMPORARY for the client demo: hides the TEST MODE banner on Netlify only
  # (the sign-in page still links to the test inbox). Set back to "true" after.
  NEXT_PUBLIC_TEST_MODE = "false"
