version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # openapi-typescript (API type generation) supports TypeScript 5 only
      # (peer typescript ^5.x); 6 and 7 fail npm ci. Revisit when it supports them.
      - dependency-name: typescript
        versions: [">=6"]
      # Node types follow the Node version we run (26); upgrade them together with Node.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      # Change Node versions on purpose (CI, .nvmrc and the image together).
      - dependency-name: node
        update-types: [version-update:semver-major]
